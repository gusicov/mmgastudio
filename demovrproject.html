<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/cookie-consent.js" defer></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>VR Walkthrough — MMGA Studio</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    canvas.a-canvas { display: block !important; }

    /* ── Loading ── */
    #loading {
      position: fixed; inset: 0; background: #000;
      display: flex; align-items: center; justify-content: center; gap: 5px;
      z-index: 300; transition: opacity 0.6s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .dot { width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,0.3); animation: p 1.2s ease-in-out infinite; }
    .dot:nth-child(2) { animation-delay: 0.18s; }
    .dot:nth-child(3) { animation-delay: 0.36s; }
    @keyframes p { 0%,100%{opacity:.1;transform:scale(.5)} 50%{opacity:.7;transform:scale(1)} }

    /* ── Fade ── */
    #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 200; transition: opacity 0.22s ease; }
    #fade.in { opacity: 1; pointer-events: auto; }

    /* ── Logo ── */
    #logo {
      position: fixed; top: 16px; left: 20px;
      z-index: 50; pointer-events: none;
    }
    #logo img {
      height: 54px;
      opacity: 0.88;
      filter: brightness(0) invert(1);
      display: block;
    }

    /* ── VR button ── */
    #vr-btn {
      position: fixed; top: 14px; right: 16px;
      width: 52px; height: 52px; border-radius: 12px;
      background: rgba(255,255,255,0.1);
      border: 1.5px solid rgba(255,255,255,0.22);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      color: rgba(255,255,255,0.88);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 60;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    #vr-btn:hover { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.4); color: #fff; }
    #vr-btn:active { transform: scale(0.94); }
    #vr-btn svg { width: 26px; height: 26px; }

    /* ── Hint ── */
    #hint {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      z-index: 50; pointer-events: none;
      animation: hf 3.5s ease-in-out 2s forwards;
      white-space: nowrap;
    }
    @keyframes hf { 0%{opacity:1} 65%{opacity:1} 100%{opacity:0} }

    /* ── Bottom nav wrapper ── */
    #nav-wrap {
      position: fixed; bottom: 0; left: 0; right: 0;
      z-index: 50;
      background: linear-gradient(to top, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.18) 75%, transparent 100%);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* ── Room name ── */
    #room-label {
      text-align: center;
      padding: 12px 0 7px;
      font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase;
      color: rgba(255,255,255,0.42);
      transition: opacity 0.25s;
    }

    /* ── Thumbnails ── */
    #nav-bar {
      display: flex; align-items: center; justify-content: center;
      padding: 0 16px 16px; gap: 5px;
      overflow-x: auto; overflow-y: hidden;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    #nav-bar::-webkit-scrollbar { display: none; }

    .room-card {
      flex-shrink: 0;
      width: 62px; height: 38px;
      border-radius: 3px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.06);
      opacity: 0.5;
      transition: opacity 0.2s, border-color 0.2s, transform 0.18s;
      -webkit-tap-highlight-color: transparent;
    }
    .room-card:hover { opacity: 0.78; border-color: rgba(255,255,255,0.2); transform: translateY(-1px); }
    .room-card.active { opacity: 1; border-color: rgba(255,255,255,0.6); transform: none; }

    .room-thumb { width: 100%; height: 100%; object-fit: cover; display: block; background: #0e0e0e; }

    /* ── Floor separator ── */
    .floor-sep {
      flex-shrink: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 20px; height: 38px; gap: 3px;
      margin: 0 2px;
    }
    .floor-sep-line {
      width: 1px; flex: 1;
      background: rgba(255,255,255,0.12);
    }
    .floor-sep-label {
      font-size: 7px; letter-spacing: 0.12em; text-transform: uppercase;
      color: rgba(255,255,255,0.22);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      line-height: 1;
    }

    /* ── Error ── */
    #error-msg {
      position: fixed; top: 62px; left: 50%; transform: translateX(-50%);
      background: rgba(160,25,25,0.82); backdrop-filter: blur(8px);
      color: #fff; font-size: 10.5px; letter-spacing: 0.06em;
      padding: 7px 14px; border-radius: 5px;
      display: none; z-index: 100; white-space: nowrap;
    }
  </style>
</head>
<body>

<a-scene
  id="vr-scene"
  vr-mode-ui="enabled: false"
  loading-screen="enabled: false"
  renderer="colorManagement: true; highRefreshRate: true; antialias: true; logarithmicDepthBuffer: false"
  background="color: #000">
  <a-entity id="rig">
    <a-camera
      id="cam"
      look-controls="touchEnabled: true; magicWindowTrackingEnabled: true; reverseMouseDrag: false"
      wasd-controls="enabled: false"
      fov="75" near="0.1" far="10000">
    </a-camera>
  </a-entity>
</a-scene>

<div id="loading">
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
</div>

<div id="fade"></div>

<div id="logo">
  <img src="brand_assets/logout 4.png" alt="MMGA Studio" />
</div>

<button id="vr-btn" title="Enter VR">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
    <rect x="2" y="8" width="20" height="12" rx="3"/>
    <circle cx="8.5" cy="14" r="2.2" fill="currentColor" stroke="none"/>
    <circle cx="15.5" cy="14" r="2.2" fill="currentColor" stroke="none"/>
    <path d="M11.2 14h1.6"/>
    <path d="M12 5v3"/>
    <path d="M9 5h6"/>
  </svg>
</button>

<div id="hint">Drag to explore</div>

<div id="error-msg"></div>

<div id="nav-wrap">
  <div id="room-label">—</div>
  <div id="nav-bar"></div>
</div>

<script>
'use strict';

const ROOMS = [
  // Ground Floor (GF)
  { name: 'Office',           floor: 'GF', base: 'https://qhrenderpicoss.kujiale.com/r/2026/05/15/L3D917S57ENDO4MMZPIUWIAHILUFX7ZZPIQ8.0_12000x2000.jpg_' },
  { name: 'Kitchen',          floor: 'GF', base: 'https://qhrenderpicoss.kujiale.com/r/2026/05/15/L3D917S57ENDO4MMZKYUWIAHILUFX7ZZPAI8.0_12000x2000.jpg_' },
  { name: 'Living Room · 1',  floor: 'GF', base: 'https://qhrenderpicoss.kujiale.com/r/2026/05/15/L3D917S57ENDO4MMY5IUWLUFQLUFX7ZF43Y8.0_12000x2000.jpg_' },
  { name: 'Corridor · 1',     floor: 'GF', base: 'https://qhrenderpicoss.kujiale.com/r/2026/05/15/L3D917S57ENDO4MMYRIUWLRTELUFX7ZEFKQ8.0_12000x2000.jpg_' },
  { name: 'Corridor · 2',     floor: 'GF', base: 'https://qhrenderpicoss.kujiale.com/r/2026/05/15/L3D917S57ENDO4MMYXQUWIARQLUFX7ZG4PI8.0_12000x2000.jpg_' },
  { name: 'Living Room · 2',  floor: 'GF', base: 'https://qhrenderpicoss.kujiale.com/r/2026/05/15/L3D917S57ENDO4MMY3AUWIARQLUFX7ZG72Y8.0_12000x2000.jpg_' },
  // Level 2 (2F)
  { name: 'Bathroom',         floor: '2F', base: 'https://qhrenderpicoss.kujiale.com/r/2026/05/15/L3D917S57ENDO4MM2JQUWIP3WLUFX7Z3YNA8.0_12000x2000.jpg_' },
  { name: 'Bedroom · 1',      floor: '2F', base: 'https://qhrenderpicoss.kujiale.com/r/2026/05/15/L3D917S57ENDO4MM6VAUWIQHELUFX7ZGQKY8.0_12000x2000.jpg_' },
  { name: 'Kids Bedroom · 1', floor: '2F', base: 'https://qhrenderpicoss.kujiale.com/r/2026/05/15/L3D917S57ENDO4MM7IAUWIP3WLUFX7ZYOUY8.0_12000x2000.jpg_' },
  { name: 'Kids Bedroom · 2', floor: '2F', base: 'https://qhrenderpicoss.kujiale.com/r/2026/05/15/L3D917S57ENDO4MM6WAUWIP3WLUFX7ZYJLI8.0_12000x2000.jpg_' },
  { name: 'Bedroom · 2',      floor: '2F', base: 'https://qhrenderpicoss.kujiale.com/r/2026/05/15/L3D917S57ENDO4MM7NAUWIQHELUFX7ZGROQ8.0_12000x2000.jpg_' },
];

/* Navigation hotspots — azimuth angles from KRPano API (0°=front, clockwise).
   Only skin_hotspotstyle entries included.                                    */
const HOTSPOTS = [
  /* 0 Office        */ [{ ath: 262.38, to: 3 }],
  /* 1 Kitchen       */ [{ ath: 143.38, to: 3 }],
  /* 2 Living Room 1 */ [{ ath: 117.82, to: 3 }, { ath: 39.45, to: 5 }],
  /* 3 Corridor 1    */ [{ ath: 262.02, to: 2 }, { ath: 267.68, to: 0 }, { ath: 279.61, to: 1 }, { ath: 279.69, to: 4 }],
  /* 4 Corridor 2    */ [{ ath: 9.69, to: 3 }, { ath: 96.99, to: 2 }, { ath: 129.13, to: 0 }, { ath: 189.14, to: 1 }],
  /* 5 Living Room 2 */ [{ ath: 100.27, to: 3 }, { ath: 129.45, to: 2 }],
  /* 6  Bathroom 2F       */ [],
  /* 7  Bedroom 1 2F      */ [],
  /* 8  Kids Bedroom 1 2F */ [{ ath: 22.56, to: 9 }],
  /* 9  Kids Bedroom 2 2F */ [{ ath: 292.56, to: 8 }],
  /* 10 Bedroom 2 2F      */ [],
];

const HOTSPOT_DIST = 4.5;
const HOTSPOT_SIZE = 0.90;   // plane size in world units
const HOTSPOT_BASE_Y = 1.2;  // door-level height (camera at y=0)

let currentIndex = -1;
let isTransitioning = false;
let hotspotMeshes = [];

const sceneEl   = document.getElementById('vr-scene');
const fade      = document.getElementById('fade');
const loadingEl = document.getElementById('loading');
const roomLabel = document.getElementById('room-label');
const navBar    = document.getElementById('nav-bar');
const vrBtn     = document.getElementById('vr-btn');
const errorEl   = document.getElementById('error-msg');

/* ── Hotspot canvas texture — solid circle, reads on any background ── */
function makeHotspotCanvas(name, hovered) {
  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = 256;
  const ctx = cv.getContext('2d');
  const cx = 128, cy = 128;
  const R = 90;  // outer radius of visible disc

  // Soft outer glow (wide transparent halo)
  const glow = ctx.createRadialGradient(cx, cy, R * 0.6, cx, cy, R * 1.3);
  glow.addColorStop(0, 'rgba(0,0,0,0.25)');
  glow.addColorStop(1, 'rgba(0,0,0,0.00)');
  ctx.beginPath();
  ctx.arc(cx, cy, R * 1.3, 0, Math.PI * 2);
  ctx.fillStyle = glow;
  ctx.fill();

  // Solid dark disc — clearly visible on any wall color
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.fillStyle = hovered ? 'rgba(12,12,12,0.72)' : 'rgba(8,8,8,0.56)';
  ctx.fill();

  // Outer ring
  ctx.beginPath();
  ctx.arc(cx, cy, R - 2, 0, Math.PI * 2);
  ctx.strokeStyle = hovered ? 'rgba(255,255,255,0.90)' : 'rgba(255,255,255,0.60)';
  ctx.lineWidth = hovered ? 2.4 : 1.8;
  ctx.stroke();

  // Inner ring
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.72, 0, Math.PI * 2);
  ctx.strokeStyle = hovered ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Center dot
  ctx.beginPath();
  ctx.arc(cx, cy, hovered ? 18 : 14, 0, Math.PI * 2);
  ctx.fillStyle = hovered ? '#ffffff' : 'rgba(255,255,255,0.92)';
  ctx.fill();

  return cv;
}

/* ── Hotspot management ── */
function clearHotspots() {
  hotspotMeshes.forEach(m => {
    sceneEl.object3D.remove(m);
    m.geometry.dispose();
    m.userData.normalTex.dispose();
    m.userData.hoverTex.dispose();
    m.material.dispose();
  });
  hotspotMeshes = [];
}

/* Spread overlapping hotspots vertically, centered around eye level (y=0). */
function spreadHotspotsY(spots) {
  // Group indices that are within 10° of each other
  const assigned = new Array(spots.length).fill(-1);
  const groups = [];
  for (let i = 0; i < spots.length; i++) {
    if (assigned[i] >= 0) continue;
    const g = [i];
    assigned[i] = groups.length;
    for (let j = i + 1; j < spots.length; j++) {
      if (assigned[j] < 0 && Math.abs(spots[j].ath - spots[i].ath) < 10) {
        g.push(j);
        assigned[j] = groups.length;
      }
    }
    groups.push(g);
  }
  // Assign y values centered around HOTSPOT_BASE_Y with 0.42 step
  const result = [...spots];
  const STEP = 0.42;
  groups.forEach(g => {
    const n = g.length;
    g.forEach((idx, k) => {
      result[idx] = { ...spots[idx], y: HOTSPOT_BASE_Y + ((n - 1) / 2 - k) * STEP };
    });
  });
  return result;
}

function buildHotspots(roomIndex) {
  clearHotspots();
  const spots = HOTSPOTS[roomIndex];
  if (!spots || spots.length === 0) return;

  const placed = spreadHotspotsY(spots);

  placed.forEach(spot => {
    const athRad = (spot.ath * Math.PI) / 180;
    const x = HOTSPOT_DIST * Math.sin(athRad);
    const z = -HOTSPOT_DIST * Math.cos(athRad);

    const normalTex = new THREE.CanvasTexture(makeHotspotCanvas(ROOMS[spot.to].name, false));
    const hoverTex  = new THREE.CanvasTexture(makeHotspotCanvas(ROOMS[spot.to].name, true));

    const mat = new THREE.MeshBasicMaterial({
      map: normalTex, transparent: true, depthWrite: false, side: THREE.DoubleSide,
    });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(HOTSPOT_SIZE, HOTSPOT_SIZE), mat);
    mesh.position.set(x, spot.y, z);
    mesh.userData = { targetIndex: spot.to, normalTex, hoverTex, isHotspot: true };

    sceneEl.object3D.add(mesh);
    hotspotMeshes.push(mesh);
  });
}

/* ── Billboard loop — hotspots always face camera ── */
(function loop() {
  requestAnimationFrame(loop);
  const cam = sceneEl.camera;
  if (!cam || hotspotMeshes.length === 0) return;
  const p = new THREE.Vector3();
  cam.getWorldPosition(p);
  hotspotMeshes.forEach(m => m.lookAt(p));
})();

/* ── Raycaster helpers ── */
const _ray = new THREE.Raycaster();

function hitHotspot(clientX, clientY) {
  const canvas = document.querySelector('canvas.a-canvas');
  if (!canvas || !sceneEl.camera || hotspotMeshes.length === 0) return null;
  const r = canvas.getBoundingClientRect();
  _ray.setFromCamera({
    x:  (clientX - r.left) / r.width  * 2 - 1,
    y: -((clientY - r.top)  / r.height * 2 - 1),
  }, sceneEl.camera);
  const hits = _ray.intersectObjects(hotspotMeshes, false);
  return hits.length > 0 ? hits[0].object : null;
}

/* ── Hover + drag detection ── */
let hoveredMesh = null;
let _downX = 0, _downY = 0, _dragged = false;

document.addEventListener('mousedown', e => {
  _downX = e.clientX; _downY = e.clientY; _dragged = false;
});

document.addEventListener('mousemove', e => {
  // Mark as drag only when button is held and moved > 4px
  if (e.buttons & 1) {
    if (Math.abs(e.clientX - _downX) > 4 || Math.abs(e.clientY - _downY) > 4) _dragged = true;
  }

  if (isTransitioning) return;
  const hit = hitHotspot(e.clientX, e.clientY);
  if (hit === hoveredMesh) return;
  if (hoveredMesh) {
    hoveredMesh.material.map = hoveredMesh.userData.normalTex;
    hoveredMesh.material.needsUpdate = true;
    hoveredMesh.scale.set(1, 1, 1);
  }
  hoveredMesh = hit;
  const canvas = document.querySelector('canvas.a-canvas');
  if (hit) {
    hit.material.map = hit.userData.hoverTex;
    hit.material.needsUpdate = true;
    hit.scale.set(1.12, 1.12, 1.12);
    if (canvas) canvas.style.cursor = 'pointer';
  } else {
    if (canvas) canvas.style.cursor = '';
  }
});

/* ── Click ── */
document.addEventListener('click', e => {
  if (_dragged || isTransitioning) return;
  const hit = hitHotspot(e.clientX, e.clientY);
  if (hit && hit.userData.isHotspot) goToRoom(hit.userData.targetIndex);
});

/* ── Custom cubemap loader ── */
function loadCubeTexture(faceUrls, mirrorSet, onLoad, onError) {
  const images = new Array(6);
  let pending = 6;
  let failed = false;

  function tryFinish() {
    if (failed) return;
    if (--pending === 0) {
      const tex = new THREE.CubeTexture(images);
      tex.needsUpdate = true;
      onLoad(tex);
    }
  }

  faceUrls.forEach((url, i) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onerror = () => { if (!failed) { failed = true; onError(); } };
    img.onload = () => {
      if (!mirrorSet.has(i)) { images[i] = img; tryFinish(); return; }
      const cv = document.createElement('canvas');
      cv.width = img.width; cv.height = img.height;
      const ctx = cv.getContext('2d');
      ctx.translate(img.width, img.height);
      ctx.scale(-1, -1);
      ctx.drawImage(img, 0, 0);
      const flipped = new Image();
      flipped.onerror = () => { if (!failed) { failed = true; onError(); } };
      flipped.onload = () => { images[i] = flipped; tryFinish(); };
      cv.toBlob(blob => { flipped.src = URL.createObjectURL(blob); });
    };
    img.src = url;
  });
}

sceneEl.addEventListener('loaded', () => {
  buildNav();
  goToRoom(0, true);
});

function buildNav() {
  let prevFloor = null;
  ROOMS.forEach((room, i) => {
    if (prevFloor !== null && room.floor !== prevFloor) {
      const sep = document.createElement('div');
      sep.className = 'floor-sep';
      sep.innerHTML = `<div class="floor-sep-line"></div><div class="floor-sep-label">${room.floor}</div><div class="floor-sep-line"></div>`;
      navBar.appendChild(sep);
    }
    prevFloor = room.floor;
    const card = document.createElement('div');
    card.className = 'room-card';
    const thumbUrl = room.base + 'f?x-oss-process=image/resize,w_160|image/quality,q_75';
    card.innerHTML = `<img class="room-thumb" src="${thumbUrl}" alt="${room.name}" loading="lazy" />`;
    card.addEventListener('click', () => {
      if (isTransitioning || i === currentIndex) return;
      goToRoom(i);
    });
    navBar.appendChild(card);
  });
}

function updateNav(index) {
  const cards = document.querySelectorAll('.room-card');
  cards.forEach((c, i) => c.classList.toggle('active', i === index));
  const activeCard = cards[index];
  if (activeCard) activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  const room = ROOMS[index];
  roomLabel.textContent = room.floor !== 'GF' ? `${room.floor}  ·  ${room.name}` : room.name;
}

function goToRoom(index, instant) {
  if (isTransitioning) return;
  if (index === currentIndex) return;
  isTransitioning = true;

  const room = ROOMS[index];
  const faces = [
    room.base + 'l',  // px
    room.base + 'r',  // nx
    room.base + 'u',  // py
    room.base + 'd',  // ny
    room.base + 'b',  // pz
    room.base + 'f',  // nz
  ];
  const mirrorSet = new Set([2, 3]);

  const doLoad = () => {
    updateNav(index);
    loadCubeTexture(faces, mirrorSet,
      (cubeTexture) => {
        sceneEl.object3D.background = cubeTexture;
        currentIndex = index;
        buildHotspots(index);
        requestAnimationFrame(() => {
          fade.classList.remove('in');
          setTimeout(() => { isTransitioning = false; }, 260);
        });
        if (loadingEl && !loadingEl.classList.contains('hidden')) {
          setTimeout(() => loadingEl.classList.add('hidden'), 100);
        }
      },
      () => {
        showError('Could not load panorama.');
        isTransitioning = false;
        fade.classList.remove('in');
        if (loadingEl) loadingEl.classList.add('hidden');
      }
    );
  };

  clearHotspots();
  fade.classList.add('in');
  setTimeout(doLoad, instant ? 80 : 220);
}

vrBtn.addEventListener('click', async () => {
  if (navigator.xr) {
    const supported = await navigator.xr.isSessionSupported('immersive-vr').catch(() => false);
    if (supported) {
      sceneEl.is('vr-mode') ? sceneEl.exitVR() : sceneEl.enterVR();
      return;
    }
  }
  document.fullscreenElement
    ? document.exitFullscreen().catch(() => {})
    : document.documentElement.requestFullscreen().catch(() => {});
});

sceneEl.addEventListener('enter-vr', () => { vrBtn.style.opacity = '0'; });
sceneEl.addEventListener('exit-vr',  () => { vrBtn.style.opacity = ''; });

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'd') goToRoom((currentIndex + 1) % ROOMS.length);
  if (e.key === 'ArrowLeft'  || e.key === 'a') goToRoom((currentIndex - 1 + ROOMS.length) % ROOMS.length);
  if (e.key === 'f' || e.key === 'F') document.documentElement.requestFullscreen?.().catch(() => {});
});

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.style.display = 'block';
  setTimeout(() => { errorEl.style.display = 'none'; }, 5000);
}
</script>
</body>
</html>
